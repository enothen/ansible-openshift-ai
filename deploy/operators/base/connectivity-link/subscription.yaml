# Red Hat Connectivity Link (rhcl-operator) is a cluster-wide (AllNamespaces)
# operator, so it installs into the global "openshift-operators" namespace and
# reuses its default OperatorGroup — no dedicated OperatorGroup is required.
# It provides the dependencies for KServe LLMInferenceService.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
